<!doctype html>
<html lang="zh-Hant-TW" data-theme="candy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吃什麼轉盤</title>
<meta name="description" content="轉一下就知道今天吃什麼：篩選、近期權重、分享連結，資料只存在你的瀏覽器。">
<meta name="theme-color" content="#FFF7F0">
<meta property="og:type" content="website">
<meta property="og:title" content="吃什麼轉盤">
<meta property="og:description" content="轉一下就知道今天吃什麼。把轉盤用連結分享給朋友，一起決定！">
<meta property="og:url" content="https://cornnnnnnnn.github.io/food-choice/">
<meta property="og:image" content="https://cornnnnnnnn.github.io/food-choice/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="吃什麼轉盤：轉一下就知道今天吃什麼">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFF7F0;
  --surface: #FFFFFF;
  --ink: #3D2C3E;
  --muted: #6E5D70;
  --primary: #FF6F91;
  --primary-ink: #3D2C3E;
  --accent-text: #C2185B;
  --chip: #FFE9EF;
  --line: #F1DCE3;
  --danger: #D32F4F;
  --focus: #3A7BD5;
  --shadow: 0 8px 24px rgba(61, 44, 62, .12);
  --font: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
}
:root[data-theme="midnight"] {
  --bg: #1C1828;
  --surface: #2A2440;
  --ink: #FFF5F8;
  --muted: #C9BEDB;
  --primary: #FF8FAB;
  --primary-ink: #1C1828;
  --accent-text: #FFB3C6;
  --chip: #3A3154;
  --line: #463D63;
  --danger: #FF8A9B;
  --focus: #8FB8FF;
  --shadow: 0 8px 24px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
[hidden] { display: none !important; }

/* ---------- header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
  background: var(--bg);
  max-width: 1100px; margin: 0 auto;
}
.app-header select {
  flex: 1; min-width: 0; min-height: 44px;
  padding: 0 12px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 700;
}
.icon-btn {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--surface);
  font-size: 20px; line-height: 1; display: grid; place-items: center;
}

/* ---------- layout ---------- */
main {
  max-width: 1100px; margin: 0 auto;
  padding: 4px 16px calc(88px + env(safe-area-inset-bottom));
}
.panel { display: none; }
body[data-tab="spin"] .panel-spin,
body[data-tab="list"] .panel-list,
body[data-tab="history"] .panel-history,
body[data-tab="settings"] .panel-settings { display: block; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button {
  min-height: 58px; border: none; background: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; color: var(--muted);
}
nav.tabs button span { font-size: 20px; }
nav.tabs button[aria-current="page"] { color: var(--accent-text); font-weight: 700; }

@media (min-width: 900px) {
  main {
    display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr);
    gap: 32px; align-items: start;
  }
  .panel-spin { display: block !important; position: sticky; top: 72px; }
  body[data-tab="spin"] .panel-list { display: block; }
  nav.tabs { grid-template-columns: repeat(3, 1fr); }
  nav.tabs .tab-spin { display: none; }
}

/* ---------- wheel ---------- */
.wheel-wrap {
  position: relative; width: min(100%, 420px); aspect-ratio: 1 / 1;
  margin: 18px auto 0;
}
#wheel {
  display: block; width: 100%; height: 100%; border-radius: 50%;
  box-shadow: 0 12px 32px rgba(61, 44, 62, .18);
}
#wheel.fade { animation: fadeIn .3s ease; }
@keyframes fadeIn { from { opacity: .15; } to { opacity: 1; } }
.pointer {
  position: absolute; top: -14px; left: 50%; z-index: 2;
  width: 34px; height: 46px; transform: translateX(-50%);
  filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .25));
  pointer-events: none;
}
.pointer.bounce { animation: bounce .5s ease; }
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  35% { transform: translateX(-50%) translateY(-10px); }
  65% { transform: translateX(-50%) translateY(2px); }
}
.spin-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 92px; height: 92px; border-radius: 50%;
  border: 6px solid var(--surface); background: var(--primary); color: var(--primary-ink);
  font-size: 24px; font-weight: 700; box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
  touch-action: manipulation;
}
.spin-btn[aria-disabled="true"] { cursor: progress; }
.hint { text-align: center; color: var(--muted); font-size: 14px; margin: 12px 0 4px; min-height: 20px; }

.banner, .excluded, .empty {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--chip); border-radius: 14px; padding: 10px 14px; margin: 10px 0;
  font-size: 14px;
}
.banner span, .excluded span { flex: 1; min-width: 0; }
.empty { flex-direction: column; text-align: center; }
.empty p { margin: 0; font-weight: 700; }

.filters { margin-top: 8px; }
.chips {
  display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); font-size: 14px;
}
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 700; }
.chip:disabled, .is-spinning .app-header select { opacity: .5; cursor: not-allowed; }

/* ---------- generic ---------- */
.card { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); margin: 12px 0; }
h2 { font-size: 20px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 18px 0 8px; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; margin: 4px 0; }
.btn {
  min-height: 44px; padding: 0 18px; border-radius: 14px; border: none;
  font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-ghost { background: var(--chip); }
.btn-danger { background: var(--danger); color: #FFFFFF; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn:disabled, .icon-sm:disabled, .star:disabled { opacity: .45; cursor: not-allowed; }
.btn-link { background: none; border: none; color: var(--accent-text); text-decoration: underline; min-height: 44px; }
.tool-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }

/* ---------- list ---------- */
.items { list-style: none; padding: 0; margin: 8px 0; }
.item { border-bottom: 1px solid var(--line); padding: 10px 0; }
.item:last-child { border-bottom: none; }
.item-main { display: flex; align-items: center; gap: 10px; }
.item-main input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--primary); flex: none; }
.item-emoji { font-size: 24px; width: 32px; text-align: center; flex: none; }
.item-info { flex: 1; min-width: 0; }
.item-name { font-weight: 700; overflow-wrap: anywhere; }
.item-meta { font-size: 13px; color: var(--muted); }
.item-pct { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent-text); flex: none; }
.item.off .item-name, .item.off .item-emoji { opacity: .45; }
.item-sub { display: flex; align-items: center; gap: 4px; margin-top: 4px; padding-left: 64px; }
.stars { display: flex; flex: 1; }
.star {
  width: 36px; height: 36px; border: none; background: none; font-size: 20px; color: #E8A400; padding: 0;
}
:root[data-theme="midnight"] .star { color: #FFD166; }
.icon-sm { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--chip); font-size: 16px; }
.reason { font-size: 13px; color: var(--muted); }

/* ---------- history ---------- */
.seg { display: inline-flex; background: var(--chip); border-radius: 12px; padding: 3px; }
.seg button { border: none; background: none; min-height: 36px; padding: 0 14px; border-radius: 9px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 700; box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
.bar-row { display: grid; grid-template-columns: 44px 1fr 32px; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
.bar-track { height: 14px; background: var(--chip); border-radius: 7px; overflow: hidden; }
.bar { height: 100%; background: var(--primary); border-radius: 7px; }
.bar-num { text-align: right; font-variant-numeric: tabular-nums; }
.rank { margin: 4px 0; padding-left: 22px; }
.rank li { margin: 3px 0; }
.hist-list { list-style: none; padding: 0; margin: 0; }
.hist-list li { display: flex; gap: 10px; padding: 6px 0; font-size: 14px; border-bottom: 1px dashed var(--line); }
.hist-list time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.hist-list .rej span { text-decoration: line-through; opacity: .55; }
.tag { font-size: 12px; padding: 0 6px; border-radius: 6px; background: var(--chip); color: var(--muted); }

/* ---------- settings ---------- */
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--line); }
.setting:last-of-type { border-bottom: none; }
.setting select { min-height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 8px; }
.setting input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--primary); }

/* ---------- dialogs ---------- */
dialog {
  border: none; border-radius: 24px; padding: 24px; width: min(92vw, 400px);
  background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
}
dialog::backdrop { background: rgba(30, 20, 35, .5); }
.result { text-align: center; animation: pop .35s ease; }
@keyframes pop { from { opacity: 0; } to { opacity: 1; } }
.result-emoji { font-size: 68px; line-height: 1.1; min-height: 20px; }
.result-name { font-size: 30px; margin: 6px 0 10px; overflow-wrap: anywhere; }
.result-line { margin: 0 0 6px; }
.result-night { margin: 0 0 6px; color: var(--accent-text); font-size: 14px; }
.result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.result-actions.single { grid-template-columns: 1fr; }
dialog.destiny { box-shadow: 0 0 0 4px #FFD166, 0 0 48px 12px rgba(255, 209, 102, .75); }
#confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
.dlg-title { font-size: 20px; font-weight: 700; margin: 0 0 16px; text-align: center; }
.dlg-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.field { display: block; margin: 12px 0; }
.field > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--bg);
}
.field-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.form-error { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); text-align: center;
}

/* ---------- tests (?test) ---------- */
.test-panel { position: fixed; inset: 0; overflow: auto; background: var(--bg); padding: 16px; z-index: 100; font-size: 14px; }
.test-panel li.pass::marker { content: "✅ "; }
.test-panel li.fail::marker { content: "❌ "; }
.test-panel li { margin: 4px 0; }

@media (prefers-reduced-motion: reduce) {
  .pointer.bounce, #wheel.fade, .result { animation: none; }
}
</style>
</head>
<body data-tab="spin">

<header class="app-header">
  <label class="sr-only" for="wheelSelect">選擇轉盤</label>
  <select id="wheelSelect"></select>
  <button class="icon-btn" id="soundBtn" type="button" aria-label="音效與震動" aria-pressed="true">🔊</button>
  <button class="icon-btn" id="shareBtn" type="button" aria-label="分享這個轉盤">🔗</button>
</header>

<main>
  <section class="panel panel-spin" aria-label="轉盤">
    <div id="tempBanner" class="banner" hidden>
      <span id="tempText"></span>
      <button type="button" class="btn btn-ghost btn-sm" id="tempExit">結束試轉</button>
    </div>
    <div class="wheel-wrap" id="wheelWrap">
      <svg class="pointer" id="pointer" viewBox="0 0 34 46" aria-hidden="true">
        <path d="M17 45 C 6 28, 1 21, 1 16 A 16 16 0 0 1 33 16 C 33 21, 28 28, 17 45 Z" fill="var(--primary)" stroke="var(--surface)" stroke-width="2"/>
        <circle cx="17" cy="16" r="6" fill="var(--surface)"/>
      </svg>
      <canvas id="wheel" aria-hidden="true"></canvas>
      <button id="spinBtn" class="spin-btn" type="button">轉！</button>
    </div>
    <p class="hint" id="wheelHint"></p>
    <div id="excludedBar" class="excluded" hidden>
      <span id="excludedText"></span>
      <button type="button" class="btn btn-ghost btn-sm" id="restoreExcluded">全部放回</button>
    </div>
    <div id="emptyMsg" class="empty" hidden>
      <p>沒有符合條件的選項</p>
      <button type="button" class="btn btn-primary btn-sm" id="clearFilters">清除篩選</button>
    </div>
    <div class="filters">
      <div class="chips" id="catFilters" role="group" aria-label="類別篩選"></div>
      <div class="chips" id="priceFilters" role="group" aria-label="價位篩選"></div>
    </div>
  </section>

  <section class="panel panel-list" aria-label="清單"><div id="listRoot"></div></section>
  <section class="panel panel-history" aria-label="紀錄"><div id="historyRoot"></div></section>
  <section class="panel panel-settings" aria-label="設定"><div id="settingsRoot"></div></section>
</main>

<nav class="tabs" aria-label="分頁">
  <button type="button" data-tab="spin" class="tab-spin"><span aria-hidden="true">🎡</span>轉盤</button>
  <button type="button" data-tab="list"><span aria-hidden="true">📝</span>清單</button>
  <button type="button" data-tab="history"><span aria-hidden="true">📊</span>紀錄</button>
  <button type="button" data-tab="settings"><span aria-hidden="true">⚙️</span>設定</button>
</nav>

<div id="live" class="sr-only" aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>

<dialog id="resultDlg" aria-labelledby="resultName">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="result">
    <div class="result-emoji" id="resultEmoji" aria-hidden="true"></div>
    <h2 class="result-name" id="resultName"></h2>
    <p class="result-line" id="resultLine"></p>
    <p class="result-night" id="resultNight" hidden></p>
    <div class="result-actions" id="resultActions">
      <button type="button" class="btn btn-primary" id="acceptBtn">就吃這個</button>
      <button type="button" class="btn btn-ghost" id="respinBtn">再轉一次</button>
    </div>
    <button type="button" class="btn-link" id="shareResultBtn">分享結果</button>
  </div>
</dialog>

<dialog id="pickyDlg" aria-labelledby="pickyTitle">
  <p class="dlg-title" id="pickyTitle">你是不是其實不餓？</p>
  <div class="dlg-actions">
    <button type="button" class="btn btn-ghost" id="pickyAgain">我還要轉</button>
    <button type="button" class="btn btn-primary" id="pickyDecide">幫我直接決定</button>
  </div>
</dialog>

<dialog id="importDlg" aria-labelledby="importText">
  <p class="dlg-title" id="importText"></p>
  <div class="dlg-actions">
    <button type="button" class="btn btn-ghost" id="importCancel">取消</button>
    <button type="button" class="btn btn-ghost" id="importTry">先轉一次看看</button>
    <button type="button" class="btn btn-primary" id="importAdd">加入我的轉盤</button>
  </div>
</dialog>

<dialog id="itemDlg" aria-labelledby="itemDlgTitle">
  <form id="itemForm" novalidate>
    <h2 id="itemDlgTitle">新增項目</h2>
    <label class="field"><span>名稱（1–20 字）</span><input name="name" autocomplete="off" required></label>
    <label class="field"><span>emoji（單一個，可留白）</span><input name="emoji" autocomplete="off"></label>
    <div class="field-row">
      <label class="field"><span>類別</span><select name="category"></select></label>
      <label class="field"><span>價位</span><select name="price">
        <option value="1">$ 100 以下</option><option value="2">$$ 100–200</option><option value="3">$$$ 200 以上</option>
      </select></label>
      <label class="field"><span>權重</span><select name="weight">
        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
      </select></label>
    </div>
    <p class="form-error" id="itemError" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="btn btn-ghost" id="itemCancel">取消</button>
      <button type="submit" class="btn btn-primary">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDlg" aria-labelledby="confirmText">
  <p class="dlg-title" id="confirmText"></p>
  <div class="dlg-actions">
    <button type="button" class="btn btn-ghost" id="confirmCancel">取消</button>
    <button type="button" class="btn btn-primary" id="confirmOk">確定</button>
  </div>
</dialog>

<dialog id="promptDlg" aria-labelledby="promptLabel">
  <form id="promptForm" novalidate>
    <label class="field"><span id="promptLabel"></span><input id="promptInput" autocomplete="off"></label>
    <p class="form-error" id="promptError" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="btn btn-ghost" id="promptCancel">取消</button>
      <button type="submit" class="btn btn-primary">確定</button>
    </div>
  </form>
</dialog>

<dialog id="linkDlg" aria-labelledby="linkTitle">
  <p class="dlg-title" id="linkTitle">請手動複製</p>
  <textarea id="linkText" rows="5" readonly></textarea>
  <div class="dlg-actions">
    <button type="button" class="btn btn-primary" id="linkClose">關閉</button>
  </div>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* =====================================================================
 * 常數
 * ===================================================================== */
const STORAGE_KEY = 'food-choice:v1';
const TAU = Math.PI * 2;
const POINTER = Math.PI * 1.5;          // 指針在正上方（canvas 角度，順時針為正）
const TWO32 = 4294967296;
const FONT = '"Noto Sans TC", system-ui, sans-serif';

const CATS = [
  ['rice', '飯類'], ['noodle', '麵類'], ['snack', '小吃'], ['foreign', '異國'],
  ['fast', '速食'], ['light', '輕食'], ['hotpot', '鍋物'],
];
const CAT_IDS = CATS.map(c => c[0]);
const CAT_LABEL = Object.fromEntries(CATS);
const PRICE_LABEL = { 1: '$', 2: '$$', 3: '$$$' };
const LIMITS = { name: 20, itemsMin: 2, itemsMax: 50, history: 500, wheels: 100, shareUrl: 2000, shareCode: 8000, inflate: 65536 };
const THEMES = ['candy', 'midnight'];
const EGG_IDS = ['midnight'];

const DEFAULT_ITEMS = [
  ['便當', '🍱', 'rice', 1], ['滷肉飯', '🍚', 'rice', 1], ['雞肉飯', '🐔', 'rice', 1],
  ['咖哩飯', '🍛', 'rice', 2], ['炒飯', '🍳', 'rice', 1], ['自助餐', '🍽️', 'rice', 1],

}
function tick() {
  if (!settings().sound) return;
  const ctx = ensureAudio();
  if (ctx) beep(ctx, 1800, ctx.currentTime, 0.03, 'square', 0.05);
  if (navigator.vibrate) navigator.vibrate(10);   // iOS Safari 不支援，會直接略過
}
function fanfare() {
  const ctx = ensureAudio();
  if (!ctx) return;
  const t = ctx.currentTime;
  [523.25, 659.25, 783.99].forEach((f, k) => beep(ctx, f, t + k * 0.12, 0.28, 'triangle', 0.16));
}

/* =====================================================================
 * 撒彩帶（畫在結果卡內的全螢幕 canvas，才能蓋過 modal 背景）
 * ===================================================================== */
let confettiToken = 0;
function confetti() {
  const cv = $('#confetti');
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pal = PALETTES.candy.concat('#FF6F91', '#FFD166');
  const ox = W / 2, oy = H * 0.42;
  const ps = Array.from({ length: 120 }, () => ({
    x: ox, y: oy, vx: (randUnit() - 0.5) * 16, vy: -(randUnit() * 12 + 4),
    r: randUnit() * TAU, vr: (randUnit() - 0.5) * 0.4,
    w: 6 + randUnit() * 5, h: 4 + randUnit() * 3, c: randomOf(pal),
  }));
  const token = ++confettiToken;
  const start = performance.now(), DUR = 1500;
  function frame(now) {
    if (token !== confettiToken) return;
    const t = now - start;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = t > DUR - 300 ? Math.max(0, (DUR - t) / 300) : 1;
    for (const p of ps) {
      p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (t < DUR) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}

/* =====================================================================
 * 轉盤繪製
 * ===================================================================== */
const wheelCanvas = $('#wheel');
const wctx = wheelCanvas.getContext('2d');
let wheelSize = 0;
function sizeWheel() {
  const css = Math.max(120, Math.floor($('#wheelWrap').clientWidth));
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  wheelCanvas.width = Math.round(css * dpr);
  wheelCanvas.height = Math.round(css * dpr);
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wheelSize = css;
}
function fitLabel(text, maxWidth, fs) {
  let size = fs;
  wctx.font = `700 ${size}px ${FONT}`;
  while (size > 11 && wctx.measureText(text).width > maxWidth) {
    size -= 1;
    wctx.font = `700 ${size}px ${FONT}`;
  }
  if (wctx.measureText(text).width <= maxWidth) return text;
  const g = graphemes(text);
  while (g.length > 1 && wctx.measureText(g.join('') + '…').width > maxWidth) g.pop();
  return g.join('') + '…';
}
function drawWheel(items, R) {
  const s = wheelSize, c = s / 2, r = c - 4;
  const th = theme(), pal = PALETTES[th], ink = WHEEL_INK[th];
  wctx.clearRect(0, 0, s, s);
  const n = items.length;
  if (n === 0) {
    wctx.beginPath(); wctx.arc(c, c, r, 0, TAU);
    wctx.fillStyle = th === 'candy' ? '#EFE4E8' : '#3A3154'; wctx.fill();
    return;
  }
  const theta = TAU / n;
  const hub = 52;
  for (let i = 0; i < n; i++) {
    const a0 = i * theta + R;
    wctx.beginPath();
    wctx.moveTo(c, c);
    wctx.arc(c, c, r, a0, a0 + theta);
    wctx.closePath();
    wctx.fillStyle = pal[colorIndex(i, n)];
    wctx.fill();
    if (n > 1) { wctx.strokeStyle = THEME_BG[th]; wctx.lineWidth = 2; wctx.stroke(); }
  }
  for (let i = 0; i < n; i++) {
    const it = items[i];
    const mid = i * theta + R + theta / 2;
    const chord = n === 1 ? r : 2 * (r * 0.62) * Math.sin(theta / 2);
    const fs = Math.max(11, Math.min(18, chord * 0.55));
    const emojiOnly = n > 45;
    const raw = emojiOnly ? (it.emoji || '•') : ((it.emoji ? it.emoji + ' ' : '') + it.name);
    wctx.save();
    wctx.translate(c, c);
    wctx.rotate(mid);
    wctx.fillStyle = ink;
    wctx.textAlign = 'right';
    wctx.textBaseline = 'middle';
    const label = fitLabel(raw, r - 16 - hub, fs);
    wctx.fillText(label, r - 16, 0);
    wctx.restore();
  }
  wctx.beginPath(); wctx.arc(c, c, r, 0, TAU);
  wctx.lineWidth = 6; wctx.strokeStyle = THEME_BG[th]; wctx.stroke();
}
function fadeWheel() {
  wheelCanvas.classList.remove('fade');
  void wheelCanvas.offsetWidth;
  wheelCanvas.classList.add('fade');
}

/* =====================================================================
 * 候選集合、權重、輪次
 * ===================================================================== */
const activeWheel = () => state.temp || data().wheels.find(w => w.id === data().activeWheelId) || data().wheels[0];
const activeWheelKey = () => state.temp ? 'temp' : data().activeWheelId;
function candidates() {
  const { cats, prices } = state.filters;
  return activeWheel().items.filter(it => it.enabled
    && (cats.size === 0 || cats.has(it.category))
    && (prices.size === 0 || prices.has(it.price))
    && !state.excluded.has(it.id));
}
function weightsFor(items) {
  const C = settings().cooldownDays;
  const days = recencyDays(data().history, Date.now());
  return items.map(it => effectiveWeight(it.weight, days.has(it.name) ? days.get(it.name) : null, C));
}
/** 結束本輪：清空排除名單與連續否決次數。 */
function endRound() {
  state.excluded.clear();
  state.respinStreak = 0;
}
function addRecord(item, accepted) {
  if (state.temp) return;   // 試轉朋友的轉盤不寫入紀錄
  const h = data().history;
  h.push({ at: Date.now(), wheelId: data().activeWheelId, itemName: item.name, category: item.category, accepted });
  if (h.length > LIMITS.history) h.splice(0, h.length - LIMITS.history);
}

/* =====================================================================
 * 轉動
 * ===================================================================== */
async function spin() {
  if (state.spinning || anyDialogOpen()) return;
  const items = candidates();
  if (items.length === 0) {
    announce('沒有符合條件的選項');
    $('#emptyMsg').hidden = false;
    return;
  }
  if (items.length === 1) {
    ensureAudio();
    showResult(items[0], { onlyOne: true });
    return;
  }
  ensureAudio();   // 必須在使用者手勢內建立 AudioContext
  const n = items.length;
  const theta = TAU / n;
  const i = pickIndex(weightsFor(items));
  const alpha = i * theta + theta * (0.1 + 0.8 * randUnit());
  const reduce = reducedMotion();
  const N = reduce ? 1 : 5;
  const T = reduce ? 800 : 4500;
  const R0 = state.rotation;
  const delta = spinDelta(R0, alpha, N);

  setSpinning(true);
  let lastIdx = pointerIndex(R0, n);
  let lastTickAt = -Infinity;
  const start = performance.now();
  await new Promise(resolve => {
    function frame(now) {
      const t = Math.min((now - start) / T, 1);
      const R = R0 + delta * (1 - Math.pow(1 - t, 3));
      drawWheel(items, R);
      const idx = pointerIndex(R, n);
      if (idx !== lastIdx) {
        lastIdx = idx;
        if (now - lastTickAt >= 40) { lastTickAt = now; tick(); }
      }
      if (t < 1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
  state.rotation = mod(R0 + delta, TAU);
  drawWheel(items, state.rotation);
  setSpinning(false);

  const p = $('#pointer');
  p.classList.remove('bounce'); void p.getBoundingClientRect(); p.classList.add('bounce');
  showResult(items[i], { celebrate: !reduce });
}

function setSpinning(on) {
  state.spinning = on;
  document.body.classList.toggle('is-spinning', on);
  $('#spinBtn').setAttribute('aria-disabled', on ? 'true' : 'false');
  renderHeader();
  renderSpinControls();
  renderList();
}

function showResult(item, opts = {}) {
  const { onlyOne = false, noRespin = false, celebrate = false } = opts;
  state.current = item;
  state.recentResults.push({ wheelId: activeWheelKey(), name: item.name });
  if (state.recentResults.length > 10) state.recentResults.shift();
  const destiny = isDestiny(state.recentResults);

  let line;
  if (onlyOne) line = TXT.onlyOne;
  else if (destiny) line = TXT.destiny;
  else {
    let k = randIntBelow(LINES.length - 1);
    if (state.lastLine >= 0 && k >= state.lastLine) k += 1;   // 與上一句不同
    if (state.lastLine < 0) k = randIntBelow(LINES.length);
    state.lastLine = k;
    line = LINES[k];
  }
  const fill = s => s.split('{name}').join(item.name);
  $('#resultEmoji').textContent = item.emoji || '🍽️';
  $('#resultName').textContent = item.name;
  $('#resultLine').textContent = fill(line);
  const night = $('#resultNight');
  if (isNight(new Date())) { night.hidden = false; night.textContent = fill(randomOf(NIGHT_LINES)); }
  else night.hidden = true;
  const single = onlyOne || noRespin;
  $('#respinBtn').hidden = single;
  $('#resultActions').classList.toggle('single', single);
  const dlg = $('#resultDlg');
  dlg.classList.toggle('destiny', destiny);
  dlg.showModal();
  $('#acceptBtn').focus();
  if (celebrate) confetti();
  fanfare();
  announce(`結果：${item.name}`);
}

function accept() {
  const item = state.current;
  if (!item) return;
  state.current = null;
  addRecord(item, true);
  endRound();
  save();
  $('#resultDlg').close();
  renderAll();
}
function respin() {
  const item = state.current;
  if (!item) return;
  state.current = null;
  addRecord(item, false);
  state.excluded.add(item.id);
  state.respinStreak += 1;
  save();
  $('#resultDlg').close();
  renderAll();
  if (state.respinStreak >= 5 && candidates().length >= 2) {
    state.respinStreak = 0;
    $('#pickyDlg').showModal();
    return;
  }
  spin();
}

function mutate() {

  endRound();       // 編輯清單會結束本輪
  renderAll(true);
}
function uniqueWheelName(base) {
  const names = new Set(data().wheels.map(w => w.name));
  if (!names.has(base)) return base;
  for (let k = 2; ; k++) {
    const suf = `(${k})`;
    const cand = graphemes(base).slice(0, LIMITS.name - suf.length).join('') + suf;
    if (!names.has(cand)) return cand;
  }
}
function switchWheel(id) {
  state.temp = null;
  data().activeWheelId = id;
  endRound();
  save();
  renderAll(true);
}
async function newWheel() {
  if (state.spinning) return;
  const name = await promptBox('新轉盤名稱（1–20 字）', '新轉盤', wheelNameError);
  if (name === null) return;
  const w = makeWheel(uid('w_'), uniqueWheelName(name), [['選項 1', '', 'snack', 1], ['選項 2', '', 'snack', 1]]);
  data().wheels.push(w);
  switchWheel(w.id);
  toast('已新增轉盤，先到清單編輯項目吧');
}
async function renameWheel() {
  if (state.spinning) return;

  const name = await promptBox('轉盤名稱（1–20 字）', w.name, wheelNameError);
  if (name === null || name === w.name) return;
  w.name = name;
  save();
  renderAll();
}
function copyWheel() {
  if (state.spinning) return;
  const w = activeWheel();
  const base = graphemes(w.name).slice(0, LIMITS.name - 4).join('') + '（複製）';
  const copy = { id: uid('w_'), name: uniqueWheelName(base), createdAt: Date.now(), items: w.items.map(it => ({ ...it, id: uid('i_') })) };
  data().wheels.push(copy);
  switchWheel(copy.id);
  toast('已複製轉盤');
}
async function deleteWheel() {
  if (state.spinning || data().wheels.length <= 1) return;
  const w = activeWheel();
  if (!await confirmBox(`刪除轉盤「${w.name}」？這個動作無法復原。`, '刪除', true)) return;
  data().wheels = data().wheels.filter(x => x.id !== w.id);

}
async function deleteItem(it) {
  const w = activeWheel();
  if (state.spinning || w.items.length <= LIMITS.itemsMin) return;
  if (!await confirmBox(`刪除「${it.name}」？`, '刪除', true)) return;
  w.items = w.items.filter(x => x.id !== it.id);

function openItemDialog(item) {
  if (state.spinning || state.temp) return;
  const form = $('#itemForm');
  state.editingItemId = item ? item.id : null;
  $('#itemDlgTitle').textContent = item ? '編輯項目' : '新增項目';
  form.elements.name.value = item ? item.name : '';
  form.elements.emoji.value = item ? item.emoji : '';
  form.elements.category.value = item ? item.category : 'rice';
  form.elements.price.value = String(item ? item.price : 1);
  form.elements.weight.value = String(item ? item.weight : 1);
  $('#itemError').textContent = '';
  $('#itemDlg').showModal();
  form.elements.name.focus();
}
function submitItem(e) {
  e.preventDefault();
  const form = e.target, w = activeWheel(), err = $('#itemError');
  const editing = w.items.find(x => x.id === state.editingItemId) || null;
  const name = checkName(form.elements.name.value);
  if (name === null) { err.textContent = '名稱需為 1–20 字，且不能有控制字元'; return; }
  if (w.items.some(x => x.name === name && x !== editing)) { err.textContent = '這個轉盤已經有同名的項目'; return; }
  const emoji = checkEmoji(form.elements.emoji.value);
  if (emoji === null) { err.textContent = '請輸入單一個 emoji，或留白'; return; }
  const category = form.elements.category.value;
  const price = Number(form.elements.price.value);
  const weight = Number(form.elements.weight.value);
  if (!CAT_IDS.includes(category) || !isIntIn(price, 1, 3) || !isIntIn(weight, 1, 5)) { err.textContent = '欄位值不正確'; return; }
  if (editing) Object.assign(editing, { name, emoji, category, price, weight });
  else {
    if (w.items.length >= LIMITS.itemsMax) { err.textContent = '已達上限 50 項'; return; }
    w.items.push({ id: uid('i_'), name, emoji, category, price, weight, enabled: true });
  }
  $('#itemDlg').close();
  mutate();
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(data(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const a = h('a', { href: url, download: `food-choice-backup-${stamp}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function importBackup(file) {
  let parsed;
  try {
    if (file.size > 2 * 1024 * 1024) bad();
    parsed = validateState(JSON.parse(await file.text()));
  } catch (e) {
    toast('備份檔格式不正確，沒有匯入任何資料');
    return;
  }
  if (!await confirmBox('匯入會取代目前所有轉盤、紀錄與設定，確定嗎？', '匯入', true)) return;
  state.data = parsed;
  state.temp = null;
  endRound();
  save();
  renderAll(true);
  toast('匯入完成');
}

const baseUrl = () => location.href.split('#')[0];
async function wheelLink(w) {
  return baseUrl() + '#s=' + await encodeShare(w);
}
async function shareOrCopy(title, text, url) {
  if (navigator.share) {
    try { await navigator.share({ title, text, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const all = text + '\n' + url;
  try {
    await navigator.clipboard.writeText(all);
    toast('已複製');
  } catch (e) {
    $('#linkText').value = all;
    $('#linkDlg').showModal();
    $('#linkText').select();
  }
}
async function shareWheel() {
  const w = activeWheel();
  const url = await wheelLink(w);
  if (url.length > LIMITS.shareUrl) toast('轉盤太大，部分 App 可能截斷連結');
  await shareOrCopy('吃什麼轉盤', `來轉轉看「${w.name}」！`, url);
}
async function shareResult() {
  const item = state.current;
  if (!item) return;
  const url = await wheelLink(activeWheel());
  await shareOrCopy('吃什麼轉盤', `我們轉到了：${item.name}！`, url);
}
async function handleHash() {
  const m = location.hash.match(/^#s=(.+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const w = await decodeShare(m[1]);
    state.pendingImport = w;
    $('#importText').textContent = `朋友分享了轉盤「${w.name}」（${w.items.length} 項）`;
    if (!anyDialogOpen()) $('#importDlg').showModal();
  } catch (e) {
    toast('連結已損壞，無法開啟這個轉盤');
  }
}
function addWheelFrom(src) {
  const w = { id: uid('w_'), name: uniqueWheelName(src.name), createdAt: Date.now(), items: src.items.map(it => ({ ...it, id: uid('i_') })) };

function bind() {
  for (const b of document.querySelectorAll('nav.tabs button')) b.addEventListener('click', () => setTab(b.dataset.tab));

  $('#spinBtn').addEventListener('click', spin);

    state.centerTaps = state.centerTaps.filter(t => now - t < 2000);

  });

  $('#wheelSelect').addEventListener('change', e => {

  $('#tempExit').addEventListener('click', () => { if (!state.spinning) switchWheel(data().activeWheelId); });
  $('#restoreExcluded').addEventListener('click', () => {

    state.filters.prices.clear();

    renderSpin(true);
    renderList();
  });

  $('#acceptBtn').addEventListener('click', accept);
  $('#respinBtn').addEventListener('click', respin);
  $('#shareResultBtn').addEventListener('click', shareResult);
  // 用 Esc 關閉結果卡：不寫紀錄、不排除，本輪照舊。
  // 若關閉事件抵達時結果卡已被重新打開（例如再轉後只剩一項、直接顯示），不可清掉新結果。
  $('#resultDlg').addEventListener('close', () => {
    if ($('#resultDlg').open) return;
    state.current = null;
    confettiToken++;
    if (state.pendingImport && !anyDialogOpen()) $('#importDlg').showModal();
  });

  $('#pickyAgain').addEventListener('click', () => { $('#pickyDlg').close(); spin(); });
  $('#pickyDecide').addEventListener('click', () => {
    $('#pickyDlg').close();
    const items = candidates();
    if (items.length === 0) return;

  $('#importCancel').addEventListener('click', () => { state.pendingImport = null; $('#importDlg').close(); });
  $('#importTry').addEventListener('click', () => {
    const w = state.pendingImport;
    state.pendingImport = null;
    $('#importDlg').close();
    if (!w || state.spinning) return;
    state.temp = { ...w, id: 'temp' };
    endRound();
    setTab('spin');
    renderAll(true);
  });
  $('#importAdd').addEventListener('click', () => {
    const w = state.pendingImport;
    state.pendingImport = null;
    $('#importDlg').close();
    if (!w || state.spinning) return;
    addWheelFrom(w);
    setTab('spin');
  });

  const catSel = $('#itemForm').elements.category;
  catSel.replaceChildren(...CATS.map(([id, label]) => h('option', { value: id, text: label })));
  $('#itemForm').addEventListener('submit', submitItem);
  $('#itemCancel').addEventListener('click', () => $('#itemDlg').close());
  $('#linkClose').addEventListener('click', () => $('#linkDlg').close());

  $('#importFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) importBackup(f);
  });

  document.addEventListener('keydown', e => {
    const tag = e.target && e.target.tagName;
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if (!typing) {
      state.keyBuf.push(normKey(e.key));
      if (state.keyBuf.length > KONAMI.length) state.keyBuf.shift();
      if (konamiMatch(state.keyBuf)) { state.keyBuf = []; unlockMidnight(); return; }
    }
    // 焦點不在任何控制項上時，空白鍵或 Enter 也能轉
    if ((e.key === ' ' || e.key === 'Enter') && e.target === document.body && !anyDialogOpen()) {
      const spinVisible = document.body.dataset.tab === 'spin' || window.matchMedia('(min-width: 900px)').matches;
      if (spinVisible) { e.preventDefault(); spin(); }
    }
  });

  new ResizeObserver(() => {
    sizeWheel();
    if (!state.spinning) drawWheel(candidates(), state.rotation);
  }).observe($('#wheelWrap'));
  window.addEventListener('hashchange', handleHash);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!state.spinning) renderSpin(); });
}

/* =====================================================================
 * 自動測試（規格書第 8 節）
 * ===================================================================== */
async function runTests() {
  const results = [];
  const check = (name, pass, detail = '') => results.push({ name, pass: !!pass, detail });
  const safe = async (name, fn) => {
    try { await fn(); } catch (e) { check(name, false, '例外：' + (e && e.message)); }
  };

  await safe('抽選映射精確（窮舉）', () => {
    for (const ws of [[1, 2, 3, 4], [5], [3, 1, 4, 1, 5, 9, 2, 6], [2, 8, 8, 8, 1]]) {
      const W = ws.reduce((a, b) => a + b, 0);
      const cnt = ws.map(() => 0);
      for (let r = 0; r < W; r++) cnt[indexFromR(ws, r)]++;
      check(`抽選映射精確：權重 [${ws}] 每個 i 被映到 w_i 次`, cnt.every((c, i) => c === ws[i]), `次數 [${cnt}]`);
    }
  });

  await safe('拒絕取樣', () => {
    for (const W of [3, 7, 2000]) {
      const L = TWO32 - (TWO32 % W);
      check(`拒絕取樣：W = ${W} 時 L 是 W 的倍數且 L > 2^32 − W`, L % W === 0 && L > TWO32 - W, `L = ${L}`);
    }
    const W = 3, L = TWO32 - (TWO32 % W);
    const seq = [L, TWO32 - 1, 10];      // 兩個 ≥ L 的值應被拒絕，第三個接受
    let used = 0;
    const r = randIntBelow(W, () => seq[used++]);
    check('拒絕取樣：x ≥ L 時重抽，接受第一個 x < L', r === 10 % 3 && used === 3, `r = ${r}，取用 ${used} 個數`);
  });

  await safe('抽樣頻率', () => {
    const ws = [1, 2, 3, 4], W = 10, N = 100000;
    const cnt = [0, 0, 0, 0];
    for (let k = 0; k < N; k++) cnt[pickIndex(ws)]++;
    const detail = [];
    let pass = true;
    ws.forEach((w, i) => {
      const p = w / W, f = cnt[i] / N, bound = 4 * Math.sqrt(p * (1 - p) / N);
      detail.push(`p=${p} f=${f.toFixed(4)} 容許 ±${bound.toFixed(4)}`);
      if (Math.abs(f - p) > bound) pass = false;
    });
    check('抽樣頻率：權重 [1,2,3,4] 抽 100,000 次，|f − p| ≤ 4σ', pass, detail.join('；'));
  });

  await safe('有效權重', () => {
    const coef = [0, 1, 2, 3, 10].map(d => effectiveWeight(1, d, 3));
    check('有效權重：C = 3 時 d = 0,1,2,3,10 的係數為 1,2,3,4,4', coef.join() === '1,2,3,4,4', coef.join());
    const coef0 = [0, 1, 5].map(d => effectiveWeight(1, d, 0));
    check('有效權重：C = 0 時係數全為 1', coef0.every(x => x === 1), coef0.join());
    check('有效權重：從沒吃過為 b(C + 1)', effectiveWeight(2, null, 3) === 8);
  });

  await safe('旋轉', () => {
    let maxErr = 0, minDeltaOk = true, idxOk = true;
    for (let k = 0; k < 1000; k++) {
      const n = 2 + randIntBelow(49);
      const theta = TAU / n;
      const i = randIntBelow(n);
      const alpha = i * theta + theta * (0.1 + 0.8 * randUnit());
      const R0 = randUnit() * TAU;
      const N = 1 + randIntBelow(5);
      const delta = spinDelta(R0, alpha, N);
      if (delta < TAU * N) minDeltaOk = false;
      const fin = mod(alpha + R0 + delta, TAU);
      const err = Math.abs(mod(fin - POINTER + Math.PI, TAU) - Math.PI);
      maxErr = Math.max(maxErr, err);
      if (pointerIndex(mod(R0 + delta, TAU), n) !== i) idxOk = false;
    }
    check('旋轉：1,000 組停止角度與 3π/2 的差 < 1e−9', maxErr < 1e-9, `最大誤差 ${maxErr.toExponential(2)}`);
    check('旋轉：Δ ≥ 2πN', minDeltaOk);
    check('指針判定：停止時指到的格子 = 抽中的 i', idxOk);
  });

  await safe('配色', () => {
    let ok = true;
    for (let n = 2; n <= 50; n++) for (let i = 0; i < n; i++) if (colorIndex(i, n) === colorIndex((i + 1) % n, n)) ok = false;
    check('配色：n = 2…50 時相鄰兩格（含首尾）不同色', ok);
  });

  await safe('emoji 字素', () => {
    check('emoji：🌶️ 的 length 是 3，但字素數是 1', '🌶️'.length === 3 && gLen('🌶️') === 1);
    check('emoji：checkEmoji 接受 🍽️、拒絕 ab 與 🍜🍜', checkEmoji('🍽️') === '🍽️' && checkEmoji('ab') === null && checkEmoji('🍜🍜') === null);
  });

  const sample = { n: '測試', i: DEFAULT_ITEMS.map(([n, e, c, p]) => [n, e, c, p, 1]) };
  const rejects = async code => { try { await decodeShare(code); return false; } catch (e) { return true; } };
  await safe('分享', async () => {
    const code = await encodeCompact(sample);
    const back = await decodeShare(code);
    const same = back.name === sample.n && back.items.length === sample.i.length
      && back.items.every((it, k) => [it.name, it.emoji, it.category, it.price, it.weight].join('|') === sample.i[k].join('|'));
    check(`分享：編碼後解碼與原轉盤相同（格式 ${code.slice(0, 2)}，${code.length} 字元）`, same);
    const raw0 = '0.' + b64urlEncode(new TextEncoder().encode(JSON.stringify(sample)));
    check('分享：未壓縮格式 0. 也能解碼', !(await rejects(raw0)));
    check('分享：竄改一個字元（換成 base64url 以外的字元）被拒絕', await rejects(code.slice(0, 5) + '!' + code.slice(6)));
    const many = { n: 'x', i: Array.from({ length: 51 }, (_, k) => ['項目' + k, '', 'rice', 1, 1]) };
    check('分享：51 項被拒絕', await rejects(await encodeCompact(many)));
    const mutateOne = (k, v) => { const c = JSON.parse(JSON.stringify(sample)); c.i[0][k] = v; return c; };
    check('分享：類別不在 enum 被拒絕', await rejects(await encodeCompact(mutateOne(2, 'pizza'))));
    check('分享：價位為 4 被拒絕', await rejects(await encodeCompact(mutateOne(3, 4))));
    check('分享：名稱 21 字被拒絕', await rejects(await encodeCompact(mutateOne(0, '字'.repeat(21)))));
    check('分享：權重 1.5 被拒絕', await rejects(await encodeCompact(mutateOne(4, 1.5))));
    check('分享：同名項目被拒絕', await rejects(await encodeCompact(mutateOne(0, sample.i[1][0]))));
  });

  await safe('彩蛋', () => {
    const r = name => ({ wheelId: 'w', name });
    check('命中注定：連續 2 次不觸發', !isDestiny([r('A'), r('A')]));
    check('命中注定：連續 3 次觸發', isDestiny([r('B'), r('A'), r('A'), r('A')]));
    check('命中注定：不同轉盤不觸發', !isDestiny([r('A'), r('A'), { wheelId: 'v', name: 'A' }]));
    const at = (hh, mm) => new Date(2026, 9, 18, hh, mm);
    check('深夜食堂：22:59 否、23:00 是、03:59 是、04:00 否',
      !isNight(at(22, 59)) && isNight(at(23, 0)) && isNight(at(3, 59)) && !isNight(at(4, 0)));
    // 模擬逐鍵輸入，與 keydown 處理器相同：保留最近 10 鍵，每按一鍵檢查一次
    const typeKeys = keys => {
      let buf = [];
      for (const k of keys) {
        buf.push(normKey(k));
        if (buf.length > KONAMI.length) buf.shift();
        if (konamiMatch(buf)) return true;
      }
      return false;
    };
    check('宵夜模式：完整 Konami 序列觸發', typeKeys(KONAMI));
    check('宵夜模式：前面多按幾個 ↑（↑↑↑↑↓↓←→←→BA）仍觸發', typeKeys(['ArrowUp', 'ArrowUp', ...KONAMI]));
    check('宵夜模式：大寫 B、A 也觸發', typeKeys([...KONAMI.slice(0, 8), 'B', 'A']));
    check('宵夜模式：中間按錯一鍵不觸發', !typeKeys([...KONAMI.slice(0, 5), 'ArrowUp', ...KONAMI.slice(6)]));
  });

  await safe('統計', () => {
    const now = new Date(2026, 9, 18, 12).getTime();
    const day = 86400000;
    const hist = [
      { at: now - 6 * day, itemName: '拉麵', category: 'noodle', accepted: true },
      { at: now - 7 * day, itemName: '拉麵', category: 'noodle', accepted: true },
      { at: now, itemName: '便當', category: 'rice', accepted: true },
      { at: now, itemName: '火鍋', category: 'hotpot', accepted: false },
    ];
    const s = computeStats(hist, now, 7);
    check('統計：近 7 天含今天往前 6 天、只計接受的', s.total === 2 && s.rejected.length === 1 && s.rejected[0][0] === '火鍋');
  });

  const passed = results.filter(r => r.pass).length;
  console.table(results);
  const panel = h('div', { class: 'test-panel' },
    h('h2', { text: `自動測試：${passed} / ${results.length} 通過` }),
    h('ul', {}, ...results.map(r => h('li', { class: r.pass ? 'pass' : 'fail' },
      h('span', { text: r.name }), r.detail ? h('div', { class: 'muted', text: r.detail }) : null))));
  panel.dataset.passed = String(passed);
  panel.dataset.total = String(results.length);
  panel.id = 'testPanel';
  document.body.append(panel);
}
})();
</script>
</body>
</html>
